<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Star Browser · 起始页</title>
<style>
/* STAR_PALETTE */
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:clamp(48px,12vh,100px) 24px 32px;background:var(--ui-surface);color:var(--ui-text);font:13px 'SF Pro Text',-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',sans-serif}
main{width:640px;max-width:100%;margin:auto}
.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:12px}
.brand svg{width:34px;height:34px}
h1{font-size:24px;font-weight:600;letter-spacing:-.65px;margin:0}
.description{margin:0 0 28px;text-align:center;color:var(--ui-muted);font-size:12px;line-height:1.7}
form{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 14px;margin-bottom:32px;background:var(--ui-page);border:1px solid var(--ui-line);border-radius:8px}
form:focus-within{border-color:var(--ui-accent);box-shadow:0 0 0 2px var(--ui-accent-soft)}
input{flex:1;min-width:0;height:34px;border:0;background:transparent;color:var(--ui-text);font:inherit;outline:0}
input::placeholder{color:var(--ui-muted)}
button{height:32px;padding:0 14px;border:0;border-radius:5px;background:var(--ui-accent-fill);color:var(--ui-on-accent);font:inherit;cursor:pointer}
button:hover{background:var(--ui-accent-hover)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
h2{margin:0 0 8px;font-size:12px;font-weight:500;color:var(--ui-muted)}
.sites{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sites a{display:block;min-width:0;padding:12px 8px;color:var(--ui-text);border-radius:6px;text-decoration:none;overflow:hidden;text-overflow:ellipsis}
.sites a:hover{background:var(--ui-hover)}
.error{color:var(--ui-danger);line-height:1.6;margin-top:-18px;margin-bottom:24px}
.error[hidden]{display:none}
@media(max-width:600px){.sites{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="18" fill="#e8f0fe"/><path d="M32 11C34 25 39 30 53 32C39 34 34 39 32 53C30 39 25 34 11 32C25 30 30 25 32 11Z" fill="#1a73e8"/><circle cx="50" cy="14" r="4" fill="#fbbc04"/></svg><h1>Star Browser</h1></div>
  <p class="description">搜索或访问网站，开始你的工作。</p>
  <form id="search"><input id="u" aria-label="搜索或输入网址" placeholder="搜索或输入网址" autocomplete="off" spellcheck="false" aria-describedby="error" /><button type="submit">前往</button></form>
  <p id="error" class="error" role="alert" hidden></p>
  <section aria-labelledby="sitesTitle"><h2 id="sitesTitle">常用网址</h2><div class="sites"><a href="https://www.google.com">Google</a><a href="https://github.com">GitHub</a><a href="https://www.wikipedia.org">Wikipedia</a><a href="https://browserleaks.com">BrowserLeaks</a></div></section>
</main>
<script>
  const media=matchMedia('(prefers-color-scheme: dark)');
  function theme(){document.documentElement.dataset.theme=media.matches?'dark':'light';}
  theme();media.addEventListener('change',theme);
  const field=document.getElementById('u'),error=document.getElementById('error');
  field.addEventListener('input',()=>{error.hidden=true;field.removeAttribute('aria-invalid');});
  document.getElementById('search').addEventListener('submit',event=>{
    event.preventDefault();const value=field.value.trim();if(!value)return;
    let url;
    if(/^https?:\/\//i.test(value))url=value;
    else if(/^(localhost|\[[a-f\d:]+\]|[a-z\d-]+(?:\.[a-z\d-]+)+)(?::\d+)?(?:[/?#]|$)/i.test(value)&&! /\s/.test(value))url=(/^(localhost|127\.)/.test(value)?'http://':'https://')+value;
    else if(/^[a-z][a-z\d+.-]*:/i.test(value)){error.textContent='请输入 HTTP 或 HTTPS 网址';error.hidden=false;field.setAttribute('aria-invalid','true');field.focus();return;}
    else url='https://www.google.com/search?q='+encodeURIComponent(value);
    location.href=url;
  });
</script>
</body>
</html>
