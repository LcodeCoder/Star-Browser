<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Star Browser · 起始页</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
         background: linear-gradient(135deg,#0f172a 0%, #134e4a 100%); color:#e2e8f0;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .card { width:640px; max-width:92vw; background:rgba(15,23,42,.66); border:1px solid rgba(45,212,191,.35);
          border-radius:16px; padding:28px 30px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  h1 { font-size:22px; margin:0 0 6px; color:#5eead4; }
  .sub { color:#94a3b8; font-size:13px; margin:0 0 20px; line-height:1.6; }
  .row { display:flex; gap:10px; margin-bottom:18px; }
  .row input { flex:1; padding:11px 13px; border-radius:10px; border:1px solid #334155; background:#0b1220; color:#e2e8f0; font-size:14px; outline:none; }
  .row input:focus { border-color:#2dd4bf; }
  .row button { padding:11px 18px; border:0; border-radius:10px; background:#2dd4bf; color:#042f2e; font-weight:600; cursor:pointer; font-size:14px; }
  .row button:hover { background:#5eead4; }
  .sites { display:flex; flex-wrap:wrap; gap:10px; }
  .sites a { text-decoration:none; color:#cbd5e1; background:rgba(51,65,85,.6); border:1px solid #334155;
             padding:8px 14px; border-radius:999px; font-size:13px; transition:.15s; }
  .sites a:hover { background:#2dd4bf; color:#042f2e; border-color:#2dd4bf; }
  .tip { margin-top:20px; font-size:12px; color:#64748b; line-height:1.7; border-top:1px dashed #334155; padding-top:14px; }
  .tip b { color:#f87171; }
  .ok { color:#34d399; }
</style>
</head>
<body>
  <div class="card">
    <h1>Star Browser · 内置 Chromium 内核</h1>
    <p class="sub">专为外贸人提供的免费指纹浏览器 · 直接在上方输入网址并回车即可访问。<span class="ok">本页为离线起始页，浏览器内核工作正常。</span></p>
    <div class="row">
      <input id="u" type="text" placeholder="输入网址，如 baidu.com，回车访问" />
      <button id="g">前往</button>
    </div>
    <div class="sites">
      <a href="https://www.baidu.com">百度</a>
      <a href="https://www.bing.com">Bing</a>
      <a href="https://example.com">Example</a>
      <a href="https://www.wikipedia.org">Wikipedia</a>
    </div>
    <div class="tip">
      提示：<b>google.com 等部分境外站点在当前网络环境下可能无法访问（加载超时）</b>，并非浏览器故障。检测伪装度建议用 YaLaLa 或 Whoer.com。
      若打开某网站长时间白屏，底部会出现红色提示条说明原因。可换用可正常访问的站点（如百度、Bing）。
    </div>
  </div>
  <script>
    function nav(v){ var u=(v||'').trim(); if(!u) return; if(!/^https?:\/\//i.test(u)&&!/^about:/.test(u)) u='https://'+u; location.href=u; }
    document.getElementById('g').addEventListener('click', function(){ nav(document.getElementById('u').value); });
    document.getElementById('u').addEventListener('keydown', function(e){ if(e.key==='Enter') nav(this.value); });
  </script>
</body>
</html>
