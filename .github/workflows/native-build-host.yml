name: Native Chromium build host probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect native compiler and storage
        run: python3 kernel/scripts/build_host.py --output native-build-host.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build-host-mac
          path: native-build-host.json
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect native compiler and storage
        run: python kernel/scripts/build_host.py --output native-build-host.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build-host-windows
          path: native-build-host.json
