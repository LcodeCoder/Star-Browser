name: Desktop validation
on:
  workflow_dispatch:
  push:
    paths: ['macos/**', 'kernel/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['macos/**', 'kernel/**', '.github/workflows/desktop.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macos/package-lock.json
      - run: npm ci
      - run: npm run build:ui
      - run: npm test
      - run: npm run verify:source
      - run: npm run test:profile-editor
      - run: npm run test:display
      - run: npm run test:workspace-editors
      - run: npm run test:launch-experience
      - run: npm run test:browser-bookmarks
      - run: npm run test:browser-settings
      - run: npm run test:browser-newtab
      - run: npm run test:tabs
      - run: npm run test:cookie-workspace
      - run: npm run test:proxy-workspace
      - run: npm run test:batch-profiles
      - run: npm run test:editor-close
      - run: npm run test:workbench-browser
      - run: npm run test:experience
      - run: npm run test:diagnostics
      - run: npm run test:tasks
      - run: npm run test:task-transfer
      - name: Build macOS arm64 installer
        if: runner.os == 'macOS'
        run: npm run build:mac
      - name: Smoke test macOS package
        if: runner.os == 'macOS'
        run: npm run test:package
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run build:win
      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        run: npm run test:package
      - name: Verify macOS artifacts
        if: runner.os == 'macOS'
        run: npm run verify:artifacts -- --platform mac
      - name: Verify Windows artifacts
        if: runner.os == 'Windows'
        run: npm run verify:artifacts -- --platform win
      - name: Summarize actual test reports
        if: always()
        run: node scripts/report-ci-results.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            macos/test-results/
            macos/dist/*.dmg
            macos/dist/*.exe
            macos/dist/*mac*.zip
            macos/dist/*win*.zip
            macos/dist/SHA256SUMS-*.txt
  kernel-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test patch tooling
        run: python3 -m unittest discover -s kernel/tests -p 'test_*.py' -v
      - name: Cache verified pinned Chromium sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/star-kernel-upstream
          key: star-chromium-${{ hashFiles('kernel/chromium.lock.json') }}
      - name: Check pinned Chromium patches and standalone C++ policy
        env:
          STAR_KERNEL_CACHE: ${{ runner.temp }}/star-kernel-upstream
        run: python3 kernel/scripts/kernel.py verify-patches --output macos/test-results/native-kernel-patches.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-policy
          path: macos/test-results/native-kernel-patches.json
